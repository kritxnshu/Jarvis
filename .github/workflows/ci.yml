name: ci

on:
  push:
    branches: ["main", "claude/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    name: check (Linux)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: System libraries for Tauri and the headless desktop tests
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev xvfb
      - uses: astral-sh/setup-uv@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - run: uv sync --all-groups
      - run: pnpm install --frozen-lockfile
      - run: pnpm check

  macos:
    # macOS runners cost more minutes, so this job runs on pull requests and on demand
    # (Actions tab → ci → Run workflow) rather than on every push.
    name: check + build .app (macOS)
    if: github.event_name != 'push'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - run: uv sync --all-groups
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - name: Build the packaged .app (unsigned; ad-hoc signed by the toolchain)
        run: pnpm --filter @jarvis/desktop build:app
      - name: Zip the .app
        run: |
          cd apps/desktop/src-tauri/target/release/bundle/macos
          ditto -c -k --keepParent JARVIS.app "$GITHUB_WORKSPACE/JARVIS-macos-arm64.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: JARVIS-macos-arm64
          path: JARVIS-macos-arm64.zip
          retention-days: 14

[project]
name = "jarvis"
version = "0.1.0.dev0"
description = "JARVIS personal AI operating system — Python core"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "pydantic>=2.9",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
    "pyright>=1.1.390",
    "httpx>=0.28",
]
packaging = [
    "pyinstaller>=6.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/src/jarvis"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["backend/src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF", "ASYNC", "PT"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S108", "S603", "S607"]

[tool.pyright]
include = ["backend/src", "tests", "scripts"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"
executionEnvironments = [
    { root = "backend/src" },
    { root = "tests", extraPaths = ["backend/src", "."], reportPrivateUsage = false },
    { root = "scripts", extraPaths = ["backend/src"] },
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["backend/src"]
addopts = "-ra --strict-markers"
markers = [
    "macos: requires macOS; reported as SKIPPED elsewhere",
]
